---
version: "1.0"

generics:
  - name: GenericService
    label: Generic Services
    include_in_menu: false
    icon: "mdi:server"
    namespace: Services
    display_label: "name__value"
    human_friendly_id:
      - name__value
    attributes:
      - name: name
        label: Name
        kind: Text
      - name: description
        kind: Text
        label: Description
        optional: true
    
    relationships:
      - name: location
        peer: OrganizationSite
        label: Site
        cardinality: many
        kind: Attribute

      - name: logicalnetwork
        peer: NetworkLogicalNetwork
        label: Logical Network
        cardinality: many
        kind: Attribute

  - name: GenericServer
    label: Generic Servers
    include_in_menu: false
    icon: "mdi:server"
    namespace: Services
    display_label: "hostname__value"
    human_friendly_id:
      - "hostname__value"
    attributes:
      - name: hostname
        label: Hostname
        kind: Text
      - name: ipaddress
        label: IP Address
        kind: IPHost
        optional: true
      - name: description
        kind: Text
        label: Description
        optional: true
    relationships:
      - name: service
        peer: ServicesGenericService
        label: Service
        cardinality: one
        kind: Attribute

nodes:
  - name: NtpService
    label: NTP Service
    namespace: Services
    include_in_menu: false
    icon: "mdi:clock-time-four"
    inherit_from:
      - ServicesGenericService
    attributes:
      - name: prefer
        label: Prefer
        kind: Boolean
        default_value: false
        
  - name: DnsService
    label: DNS Service
    include_in_menu: false
    namespace: Services
    icon: "mdi:magnify"
    inherit_from:
      - ServicesGenericService

  - name: NTPServer
    label: NTP Server
    include_in_menu: false
    namespace: Services
    icon: "mdi:clock-time-four"
    inherit_from:
      - ServicesGenericServer

  - name: DNSServer
    label: DNS Server
    include_in_menu: false
    namespace: Services
    icon: "mdi:magnify"
    inherit_from:
      - ServicesGenericServer