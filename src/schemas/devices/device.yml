---
version: "1.0"

nodes:
- name: Device
  namespace: Network
  attributes:
  - name: hostname
    label: Hostname
    kind: Text
  - name: description
    kind: Text
    label: Description
    optional: true
  - name: serial_number
    kind: Text
    label: Serial Number
    optional: true

  relationships:
  - name: interfaces
    peer: NetworkInterface
    cardinality: many
    label: Interfaces

  - name: location
    peer: NetworkLocation
    cardinality: one
    label: Location
