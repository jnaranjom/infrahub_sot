---
version: "1.0"

generics:
  - name: GenericDevice
    label: Generic Devices
    include_in_menu: false
    icon: "mdi:information-outline"
    namespace: Network
    order_by:
      - hostname__value
    display_labels:
      - hostname__value
    human_friendly_id:
      - hostname__value
    attributes:
      - name: hostname
        label: Hostname
        kind: Text
      - name: description
        kind: Text
        label: Description
        optional: true
      - name: serial_number
        kind: Text
        label: Serial Number
        optional: true

    relationships:
      - name: interfaces
        peer: NetworkInterface
        cardinality: many
        kind: Component
        identifier: device__interfaces
        label: Interfaces

      - name: location
        peer: OrganizationBuilding
        cardinality: one
        label: Location

      - name: device_type
        peer: NetworkDeviceType
        cardinality: one
        label: Device Type

nodes:
  - name: Device
    namespace: Network
    icon: "mdi:router"
    include_in_menu: false
    generate_template: true
    inherit_from:
      - NetworkGenericDevice
      - StatusDevice
      - RoleDevice

  - name: DeviceType
    label: Device Type
    include_in_menu: false
    icon: "mdi:router"
    namespace: Network
    display_labels:
      - model__value
    human_friendly_id:
      - model__value
    attributes:
      - name: model
        kind: Text
        label: Model
      - name: manufacturer
        kind: Text
        label: Manufacturer
