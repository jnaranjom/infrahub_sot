---
version: "1.0"

nodes:
- name: Device
  namespace: Network
  icon: "mdi:router"
  include_in_menu: false
  human_friendly_id:
  - hostname__value
  attributes:
  - name: hostname
    label: Hostname
    kind: Text
  - name: description
    kind: Text
    label: Description
    optional: true
  - name: serial_number
    kind: Text
    label: Serial Number
    optional: true

  relationships:
  - name: interfaces
    peer: NetworkInterface
    cardinality: many
    label: Interfaces

  - name: location
    peer: OrganizationBuilding
    cardinality: one
    label: Location

  - name: device_type
    peer: NetworkDeviceType
    cardinality: one
    label: Device Type

- name: DeviceType
  label: Device Type
  include_in_menu: false
  icon: "mdi:router"
  namespace: Network
  human_friendly_id:
  - model__value
  attributes:
  - name: model
    kind: Text
    label: Model
  - name: manufacturer
    kind: Text
    label: Manufacturer
